<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-en="Rooms & chairs — Tamargi">الغرف والعيادات — تمرجي</title>
  <link rel="stylesheet" href="../assets/tamargi.css">
  <style>
    /* page-specific CSS: tokens only */
    .rm-cards { display: grid; gap: var(--s-3); grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
    .rm-card { display: flex; flex-direction: column; gap: var(--s-2); padding: var(--s-4); }
    .rm-card h3 { font-size: var(--fs-md); }
    .rm-card .t-row { font-size: var(--fs-xs); }
    .rm-card.is-conflict { border-color: var(--danger-line); }
    .rm-type { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding-inline: 8px; border-radius: var(--r-xs); background: var(--surface-sunk); border: 1px solid var(--line); font-size: var(--fs-xs); color: var(--text-2); }
    .rm-specs { display: flex; flex-wrap: wrap; gap: 4px; min-height: 22px; }
    .rm-grid { min-width: 860px; }
    .rm-grid th, .rm-grid td { vertical-align: top; }
    .rm-grid td { height: auto; padding: var(--s-2); border-inline-start: 1px solid var(--line); }
    .rm-grid th:first-child, .rm-grid td:first-child { position: sticky; inset-inline-start: 0; z-index: 2; background: var(--surface); border-inline-start: 0; min-width: 150px; }
    .rm-grid th:first-child { background: var(--surface-sunk); z-index: 3; }
    .rm-grid td:first-child b { display: block; font-size: var(--fs-sm); }
    .rm-grid td:first-child span { font-size: var(--fs-xs); color: var(--text-3); }
    .rm-grid tbody tr:hover td { background: transparent; }
    .rm-grid tbody tr:hover td:first-child { background: var(--surface); }
    .rm-cell { display: flex; flex-direction: column; gap: 4px; min-height: 40px; }
    .rm-blk { display: flex; flex-direction: column; gap: 2px; padding: 5px 7px; border-radius: var(--r-xs); border: 1px solid var(--line); border-inline-start-width: 3px; background: var(--surface-sunk); font-size: var(--fs-xs); line-height: 1.35; }
    .rm-blk .tm { font-weight: var(--fw-sb); color: var(--text); font-variant-numeric: tabular-nums; }
    .rm-blk.im    { border-inline-start-color: var(--done-fg); }
    .rm-blk.derma { border-inline-start-color: var(--called-fg); }
    .rm-blk.peds  { border-inline-start-color: var(--inroom-fg); }
    .rm-blk.ent   { border-inline-start-color: var(--waiting-fg); }
    .rm-blk.dent  { border-inline-start-color: var(--left-fg); }
    .rm-blk.gyn   { border-inline-start-color: var(--note); }
    .rm-blk.is-conflict { background: var(--danger-bg); border-color: var(--danger-line); border-inline-start-color: var(--danger); color: var(--danger-fg); }
    .rm-blk.is-conflict .tm { color: var(--danger-fg); }
    .rm-free { font-size: var(--fs-xs); color: var(--text-3); }
    .rm-legend { display: flex; flex-wrap: wrap; gap: var(--s-2); align-items: center; }
    .rm-branch-h { display: flex; align-items: center; gap: var(--s-2); margin-block: var(--s-5) var(--s-3); font-size: var(--fs-lg); }
    .rm-branch-h:first-child { margin-block-start: 0; }
  </style>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body data-screen="rooms" data-org-default="nile">
<main id="screen">
  <div class="t-container">

    <header class="t-screen-head">
      <div>
        <h1><span data-en="Rooms & chairs">الغرف والعيادات</span> <span class="t-tier">Tier 2</span></h1>
        <p class="t-sub mb-0"><span data-en="Bookable rooms, chairs and laser rooms in">الغرف والكراسي وغرف الليزر اللي بتتحجز في</span> <b data-branch-name></b><span data-en=", and which doctor uses each one, when.">، ومين من الأطباء بيستخدم كل واحدة وإمتى.</span></p>
      </div>
      <div class="t-actions">
        <a class="t-btn" href="doctors-branches.html"><svg class="t-icon sm"><use href="#i-users"/></svg><span data-en="Doctors & branches">الأطباء والفروع</span></a>
        <button class="t-btn primary" type="button" data-open="#rm-add"><svg class="t-icon sm"><use href="#i-plus"/></svg><span data-en="Add room">ضيف غرفة</span><span class="t-kbd">R</span></button>
      </div>
    </header>

    <div class="mb-4"
         data-note="Conflicts are computed from the schedules, not typed in: a room booked by two doctors at once, or one doctor scheduled in two branches at the same hour. Shown as a warning with the fix, never a hard block, because the owner may be mid-change."
         data-note-ar="التعارضات بتتحسب من الجداول، مش بتتكتب: غرفة محجوزة لطبيبين في نفس الوقت، أو طبيب متجدول في فرعين في نفس الساعة. بتظهر كتنبيه ومعاها الحل، مش منع، لأن المالك ممكن يكون في نص تعديل."><div id="rm-conflicts" class="t-stack"></div></div>

    <section class="mb-6" aria-labelledby="rm-list-h">
      <h2 id="rm-list-h" class="t-sr" data-en="Rooms">الغرف</h2>
      <div
           data-note="A room has a TYPE (consult, dental chair, laser, procedures), never a specialty. Specialty tags under each room are derived from the doctors who use it this week; Room 3 in Toreil hosts dermatology, paediatrics and ENT by time slot."
           data-note-ar="الغرفة ليها نوع (كشف، كرسي أسنان، ليزر، إجراءات) ومش ليها تخصص. شارات التخصص تحت كل غرفة جاية من الأطباء اللي بيستخدموها الأسبوع ده؛ غرفة ٣ في توريل فيها جلدية وأطفال وأنف وأذن بالميعاد."><div id="rm-cards"></div></div>
    </section>

    <section class="t-card flush" aria-labelledby="rm-grid-h">
      <div class="t-card-head">
        <h2 id="rm-grid-h" data-en="Weekly room occupancy">إشغال الغرف في الأسبوع</h2>
        <div class="t-actions rm-legend" id="rm-legend"></div>
      </div>
      <div class="t-table-wrap" style="border:0;border-radius:0"
           data-note="Weekly grid: rows are rooms, columns are days, each block is one doctor's shift (time · doctor · specialty). It is built from doctor schedules (doctor × branch × room × time), so editing a doctor's hours updates this grid; there is no second place to keep in sync."
           data-note-ar="جدول الأسبوع: الصفوف غرف والأعمدة أيام، وكل مربع وردية طبيب (الوقت · الطبيب · التخصص). بيتبني من جداول الأطباء (طبيب × فرع × غرفة × وقت)، فتعديل مواعيد الطبيب بيغيّر الجدول ده؛ مفيش مكان تاني لازم يتظبط.">
        <table class="t-table rm-grid">
          <thead><tr id="rm-grid-head"></tr></thead>
          <tbody id="rm-grid-body"></tbody>
        </table>
      </div>
      <div class="t-card-foot"><svg class="t-icon sm"><use href="#i-info"/></svg><span class="t-small" id="rm-foot"></span></div>
    </section>

  </div>
</main>

<!-- Add room modal -->
<div class="t-scrim" id="rm-add" hidden>
  <div class="t-modal" role="dialog" aria-modal="true" aria-labelledby="rm-add-h">
    <div class="t-modal-head">
      <h2 id="rm-add-h" data-en="Add a room or chair">ضيف غرفة أو كرسي</h2>
      <button class="t-btn icon ghost" type="button" data-close aria-label="Close" data-en-aria-label="Close" title="إغلاق" data-en-title="Close"><svg class="t-icon"><use href="#i-close"/></svg></button>
    </div>
    <div class="t-modal-body t-stack lg">
      <div class="t-form-grid">
        <div class="t-field span-2"><label class="t-label" for="rm-name"><span data-en="Name">الاسم</span><span class="req">*</span></label><input id="rm-name" class="t-input" placeholder="مثلًا: كرسي أسنان ٢" data-en-placeholder="e.g. Dental chair 2"></div>
        <div class="t-field span-2"><span class="t-label" data-en="Type">النوع</span>
          <div class="t-row tight" id="rm-types">
            <button type="button" class="t-pick is-on" data-en="Consult room">غرفة كشف</button>
            <button type="button" class="t-pick" data-en="Dental chair">كرسي أسنان</button>
            <button type="button" class="t-pick" data-en="Laser room">غرفة ليزر</button>
            <button type="button" class="t-pick" data-en="Procedures">إجراءات</button>
          </div>
          <span class="t-hint" data-en="The type decides which services can be booked here. Specialty stays with the doctor.">النوع بيحدد الخدمات اللي تتحجز هنا. التخصص بيفضل بتاع الطبيب.</span></div>
        <div class="t-field"><label class="t-label" for="rm-branch" data-en="Branch">الفرع</label><select id="rm-branch" class="t-select"></select></div>
        <div class="t-field"><span class="t-label" data-en="Booking">الحجز</span><label class="t-switch"><input type="checkbox" checked> <span data-en="Doctors can be scheduled here">الأطباء يتجدولوا فيها</span></label></div>
      </div>
    </div>
    <div class="t-modal-foot">
      <button class="t-btn ghost" type="button" data-close data-en="Cancel">إلغاء</button>
      <button class="t-btn primary" type="button" data-close data-toast="اتضافت الغرفة" data-toast-en="Room added"><span data-en="Add room">ضيف الغرفة</span><span class="t-kbd">Enter</span></button>
    </div>
  </div>
</div>

<script src="../assets/demo-data.js"></script>
<script src="../assets/shell.js"></script>
<script>
(function () {
  "use strict";
  /* All data comes from assets/demo-data.js (Tamargi.data); scope from Tamargi.ctx. */
  var D = Tamargi.data, C = Tamargi.ctx, F = D.fmt;
  var $ = function (s) { return document.querySelector(s); };
  function L() { return C.lang === "en"; }
  function tx(a, e) { return L() ? e : a; }
  function t(rec) { return F.t(rec, C.lang); }
  function fmt(h) { return F.hour(h, C.lang); }
  var DAYS = [0, 1, 2, 3, 4, 5];   /* Sat..Thu, Friday is closed in every demo branch */
  var SPC = function (sp) { return D.specialties[sp].cls; };
  function docShort(id) { var d = D.doctor(id); return tx(d.shortAr, d.shortEn); }

  function renderConflicts(blocks, conflicts) {
    var h = conflicts.filter(function (c) { return D.inScope(c.a, C) || D.inScope(c.b, C); }).map(function (c) {
      var A = c.a, B = c.b, day = F.day(A.day, C.lang), ra = D.room(A.room), ba = D.branch(A.branch), bb = D.branch(B.branch);
      var msg = c.type === "room"
        ? tx("<b>تعارض غرفة:</b> " + ra.ar + " (" + ba.ar + ") محجوزة لـ" + D.doctor(A.doctor).shortAr + " و" + D.doctor(B.doctor).shortAr + " يوم " + day + " من " + fmt(c.from) + " لـ" + fmt(c.to) + ".",
               "<b>Room conflict:</b> " + ra.en + " (" + ba.en + ") is booked for " + D.doctor(A.doctor).shortEn + " and " + D.doctor(B.doctor).shortEn + " on " + day + ", " + fmt(c.from) + "–" + fmt(c.to) + ".")
        : tx("<b>طبيب في فرعين:</b> " + D.doctor(A.doctor).shortAr + " متجدول في " + ba.ar + " و" + bb.ar + " يوم " + day + " من " + fmt(c.from) + " لـ" + fmt(c.to) + ".",
               "<b>Doctor in two branches:</b> " + D.doctor(A.doctor).shortEn + " is scheduled in " + ba.en + " and " + bb.en + " on " + day + ", " + fmt(c.from) + "–" + fmt(c.to) + ".");
      var act;
      if (c.type === "room") {
        /* suggest a bookable room of the same branch and type that is free in that slot */
        var free = D.rooms.filter(function (r) {
          return r.branch === A.branch && r.bookable && r.type === ra.type && r.id !== A.room &&
            !blocks.some(function (b) { return b.room === r.id && b.day === A.day && b.from < c.to && c.from < b.to; });
        })[0];
        act = free ? '<button class="t-btn sm" type="button" data-toast="' + tx("اتنقلت الوردية لـ" + free.ar + " والتعارض اتحل", "Shift moved to " + free.en + ", conflict solved") + '">' + tx("انقل لـ" + free.ar + " (فاضية)", "Move to " + free.en + " (free)") + "</button>"
                   : '<a class="t-btn sm" href="doctors-branches.html">' + tx("افتح جدول الأطباء", "Open doctor schedules") + "</a>";
      } else act = '<a class="t-btn sm" href="doctors-branches.html">' + tx("افتح جدول الطبيب", "Open doctor schedule") + "</a>";
      return '<div class="t-alert danger"><svg class="t-icon"><use href="#i-alert"/></svg><span>' + msg + '</span><div class="t-actions">' + act + "</div></div>";
    }).join("");
    $("#rm-conflicts").innerHTML = h || '<div class="t-alert success"><svg class="t-icon"><use href="#i-check"/></svg><span>' + tx("مفيش تعارضات في الفرع ده الأسبوع ده.", "No conflicts in this branch this week.") + "</span></div>";
  }

  function renderCards(blocks) {
    var groups = C.branches, h = "";
    groups.forEach(function (br) {
      var B = D.branch(br);
      if (groups.length > 1) h += '<h3 class="rm-branch-h"><svg class="t-icon"><use href="#i-pin"/></svg>' + t(B) + "</h3>";
      h += '<div class="rm-cards">';
      D.rooms.filter(function (r) { return r.branch === br; }).forEach(function (r) {
        var mine = blocks.filter(function (b) { return b.room === r.id; });
        var open = (B.hours.to - B.hours.from) * DAYS.length, used = mine.reduce(function (s, b) { return s + (b.to - b.from); }, 0), pct = Math.round(used / open * 100);
        var specs = [], conflict = mine.some(function (b) { return b.conflict === "room"; }), dev = D.devicesIn(r.id).length;
        mine.forEach(function (b) { if (specs.indexOf(b.sp) === -1) specs.push(b.sp); });
        h += '<article class="t-card rm-card' + (conflict ? " is-conflict" : "") + '">' +
          '<div class="t-row between"><h3>' + t(r) + '</h3><span class="rm-type">' + t(D.roomTypes[r.type]) + "</span></div>" +
          '<div class="rm-specs">' + (r.nurse ? '<span class="t-small t-muted">' + tx("التمريض: حقن وجلسات", "Nursing: injections & sessions") + "</span>" :
            specs.length ? specs.map(function (s) { return '<span class="t-spec-tag ' + SPC(s) + '">' + t(D.specialties[s]) + "</span>"; }).join("") : '<span class="t-small t-muted">' + tx("مفيش أطباء متجدولين", "No doctors scheduled") + "</span>") + "</div>" +
          (r.nurse ? "" : '<div><div class="t-row between"><span>' + tx("الإشغال", "Occupancy") + '</span><b class="t-num">' + (L() ? pct + "%" : F.num(pct, "ar") + "٪") + "</b></div>" +
            '<div class="t-meter' + (pct < 15 ? " warn" : "") + '"><i style="width:' + Math.max(pct, 2) + '%"></i></div></div>') +
          '<div class="t-row between"><a href="equipment.html">' + (L() ? dev + (dev === 1 ? " device" : " devices") : F.num(dev, "ar") + " أجهزة") + "</a>" +
          (conflict ? '<span class="t-chip danger">' + tx("تعارض", "Conflict") + "</span>" : pct === 0 && !r.nurse ? '<span class="t-chip plain">' + tx("فاضية للحجز", "Free to book") + "</span>" : "") + "</div></article>";
      });
      h += "</div>";
    });
    $("#rm-cards").innerHTML = h;
  }

  function renderGrid(blocks) {
    $("#rm-grid-head").innerHTML = "<th>" + tx("الغرفة", "Room") + "</th>" + DAYS.map(function (d) { return "<th>" + F.day(d, C.lang) + "</th>"; }).join("");
    var h = "", groups = C.branches, used = [];
    groups.forEach(function (br) {
      if (groups.length > 1) h += '<tr><td colspan="7" style="background:var(--surface-sunk)"><b class="t-small">' + t(D.branch(br)) + "</b></td></tr>";
      D.rooms.filter(function (r) { return r.branch === br; }).forEach(function (r) {
        h += "<tr><td><b>" + t(r) + "</b><span>" + t(D.roomTypes[r.type]) + "</span></td>";
        DAYS.forEach(function (di) {
          var bl = blocks.filter(function (b) { return b.room === r.id && b.day === di; }).sort(function (x, y) { return x.from - y.from; });
          h += '<td><div class="rm-cell">' + (r.nurse ? '<span class="rm-free">' + tx("التمريض", "Nursing") + "</span>" : bl.length ? bl.map(function (b) {
            if (used.indexOf(b.sp) === -1) used.push(b.sp);
            return '<div class="rm-blk ' + SPC(b.sp) + (b.conflict ? " is-conflict" : "") + '"><span class="tm">' + fmt(b.from) + "–" + fmt(b.to) + "</span><span>" + docShort(b.doctor) + " · " + t(D.specialties[b.sp]) + "</span>" +
              (b.conflict ? "<span>⚠ " + (b.conflict === "room" ? tx("الغرفة محجوزة مرتين", "Room double-booked") : tx("الطبيب في فرع تاني", "Doctor in other branch")) + "</span>" : "") + "</div>";
          }).join("") : '<span class="rm-free">' + tx("فاضية", "Free") + "</span>") + "</div></td>";
        });
        h += "</tr>";
      });
    });
    $("#rm-grid-body").innerHTML = h;
    var seen = {}; /* one legend chip per colour class (laser shares the dermatology colour) */
    $("#rm-legend").innerHTML = used.filter(function (s) { var c = SPC(s); if (seen[c]) return false; seen[c] = 1; return true; })
      .map(function (s) { return '<span class="t-spec-tag ' + SPC(s) + '">' + t(D.specialties[s]) + "</span>"; }).join("");
    var nurseRooms = D.rooms.filter(function (r) { return C.branches.indexOf(r.branch) > -1 && r.nurse; });
    $("#rm-foot").innerHTML = tx("الجمعة إجازة" + (C.branches.length > 1 ? " في كل الفروع" : "") + "." + (nurseRooms.length ? " " + nurseRooms.map(function (r) { return r.ar; }).join("، ") + " بتستخدمها التمريض طول اليوم ومبتتحجزش للأطباء." : ""),
                                 "Friday closed" + (C.branches.length > 1 ? " in all branches" : "") + "." + (nurseRooms.length ? " " + nurseRooms.map(function (r) { return r.en; }).join(", ") + " is used by nursing all day and is not booked by doctors." : ""));
  }

  function renderBranchSelect() {
    $("#rm-branch").innerHTML = D.branchesOf(C.org).map(function (b) { return '<option value="' + b.id + '"' + (b.id === C.branch ? " selected" : "") + ">" + t(b) + "</option>"; }).join("");
  }

  function render() {
    var blocks = D.blocks(C.org), conflicts = D.conflicts(C.org);
    renderConflicts(blocks, conflicts); renderCards(blocks); renderGrid(blocks); renderBranchSelect();
  }
  Tamargi.onCtx(render);
  render();

  Array.prototype.forEach.call(document.querySelectorAll("#rm-types .t-pick"), function (p) {
    p.addEventListener("click", function () { Array.prototype.forEach.call(document.querySelectorAll("#rm-types .t-pick"), function (x) { x.classList.toggle("is-on", x === p); }); });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".t-scrim"), function (s) { s.addEventListener("click", function (e) { if (e.target === s) s.hidden = true; }); });
  document.addEventListener("keydown", function (e) {
    var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
    if (!typing && (e.key === "r" || e.key === "R") && !e.ctrlKey && !e.altKey && !e.metaKey) { e.preventDefault(); $("#rm-add").hidden = false; $("#rm-name").focus(); }
  });
})();
</script>
</body>
</html>
